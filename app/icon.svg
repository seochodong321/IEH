<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 인천 축제의 밤: 인천대교(사장교) 위 밤하늘에 폭죽, 아래는 바다 -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.68" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#night)"/>

  <!-- 큰 폭죽 (금색) — 중심 (10,9) -->
  <g stroke="#fbbf24" stroke-width="1.3" stroke-linecap="round">
    <line x1="10" y1="7.2" x2="10" y2="4.2"/>
    <line x1="10" y1="10.8" x2="10" y2="13.4"/>
    <line x1="11.8" y1="9" x2="14.6" y2="9"/>
    <line x1="8.2" y1="9" x2="5.4" y2="9"/>
    <line x1="11.3" y1="7.7" x2="13.3" y2="5.7"/>
    <line x1="8.7" y1="7.7" x2="6.7" y2="5.7"/>
    <line x1="11.3" y1="10.3" x2="13.3" y2="12.3"/>
    <line x1="8.7" y1="10.3" x2="6.7" y2="12.3"/>
  </g>
  <circle cx="10" cy="9" r="1" fill="#fef3c7"/>

  <!-- 작은 폭죽 (분홍) — 중심 (26,5.5) -->
  <g stroke="#f9a8d4" stroke-width="1" stroke-linecap="round">
    <line x1="26" y1="4.2" x2="26" y2="2.6"/>
    <line x1="26" y1="6.8" x2="26" y2="8.4"/>
    <line x1="27.3" y1="5.5" x2="28.9" y2="5.5"/>
    <line x1="24.7" y1="5.5" x2="23.1" y2="5.5"/>
    <line x1="27" y1="4.5" x2="28.1" y2="3.4"/>
    <line x1="25" y1="6.5" x2="23.9" y2="7.6"/>
  </g>

  <!-- 인천대교: 주탑 + 부챗살 케이블 + 상판 -->
  <g stroke="#e0f2fe" stroke-linecap="round" fill="none">
    <g stroke-width="0.9" opacity="0.9">
      <line x1="22" y1="11.5" x2="8" y2="22"/>
      <line x1="22" y1="11.5" x2="12.5" y2="22"/>
      <line x1="22" y1="11.5" x2="16.5" y2="22"/>
      <line x1="22" y1="11.5" x2="19.5" y2="22"/>
      <line x1="22" y1="11.5" x2="25.5" y2="22"/>
      <line x1="22" y1="11.5" x2="29" y2="22"/>
    </g>
    <line x1="22" y1="10.5" x2="22" y2="22" stroke-width="1.7"/>
    <line x1="2.5" y1="22" x2="29.5" y2="22" stroke-width="1.8"/>
  </g>

  <!-- 바다 물결 -->
  <g stroke-linecap="round" fill="none">
    <path d="M4 26.5 q2 -1.6 4 0 t4 0 t4 0 t4 0 t4 0 t4 0" stroke="#7dd3fc" stroke-width="1.3"/>
    <path d="M8 29.5 q2 -1.4 4 0 t4 0 t4 0 t4 0" stroke="#38bdf8" stroke-width="1.1" opacity="0.75"/>
  </g>
</svg>
